[project]
name = "drsd"
version = "1.0.0"
description = ""
authors = [
    {name = "Kai Sugahara",email = "research@kais.jp"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "polars (>=1.41.2,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "google-genai (>=2.8.0,<3.0.0)",
    "mlflow (>=3.13.0,<4.0.0)",
    "nbconvert (>=7.17.1,<8.0.0)",
]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
ruff = "^0.15.14"
ipywidgets = "^8.1.8"
pytest = "^9.1.1"

[project.optional-dependencies]
cuda13 = []

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
